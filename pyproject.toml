[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-context-budget"
version = "0.1.1"
description = "Auditable local experiments on evidence lost under context budgets"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = []

[project.scripts]
context-budget = "context_budget.__main__:main"

[tool.setuptools.packages.find]
include = ["context_budget*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
platform = "linux"
files = ["context_budget"]
strict = true
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["context_budget"]
omit = ["context_budget/local.py"]

[tool.coverage.report]
show_missing = true
fail_under = 90
